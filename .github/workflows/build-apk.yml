name: ZTV Moyenne APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Décompresser le projet
        run: |
          unzip -o ZTV-Moyenne-APK-complet.zip
          cd ZTV_Moyenne_Android
          ls -la

      - name: Construire l'APK
        working-directory: ZTV_Moyenne_Android
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ZTV-Moyenne-APK
          path: ZTV_Moyenne_Android/app/build/outputs/apk/debug/app-debug.apk
